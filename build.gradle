plugins {
    id 'java'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

// Указываем, где искать библиотеки
repositories {
    mavenCentral()
}

dependencies {
    // 1. Платформа JUnit 5 для управления версиями [cite: 79]
    testImplementation platform('org.junit:junit-bom:5.10.0')

    // 2. Основная библиотека REST Assured [cite: 80]
    testImplementation 'io.rest-assured:rest-assured:5.3.1'

    // 3. Валидатор JSON-схем [cite: 81]
    testImplementation 'io.rest-assured:json-schema-validator:5.3.1'

    // 4. JUnit Jupiter (API и Engine для запуска тестов) [cite: 82]
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // 5. Движок для запуска тестов (решает твою ошибку с Launcher)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 6. Библиотека матчеров Hamcrest (нужна для проверок .body) [cite: 119]
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

// Настройка запуска тестов [cite: 85-87]
test {
    useJUnitPlatform()
}